<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BotC Token Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.gstatic.com/s/cinzel/v19/8vLp7wwOq61at6GS-9Cu.woff2" as="font" type="font/woff2" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: rgba(24, 24, 24, 0.95);
            --panel-border: #333;
            --alive-border: #2ecc71;
            --alive-inner: #2c3e50;
            --dead-vote-border: #9b59b6;
            --dead-bg: #1e1e1e;
            --dead-no-vote-border: #555;
            --btn-green: #27ae60;
            --btn-orange: #d35400;
            --btn-blue: #2980b9;
            --btn-purple: #8e44ad;
            --btn-red: #c0392b;
            --btn-gray: #444;
        }

        body {
            background-color: var(--bg-color);
            color: #ddd;
            font-family: 'Cinzel', 'Nanum Myeongjo', serif; 
            margin: 0;
            overflow: hidden; 
            user-select: none; 
        }
        
        button, input, .token, .token-name { font-family: inherit; }

        .panel {
            position: fixed;
            z-index: 2000;
            background: var(--panel-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
        }

        .btn-group { display: flex; gap: 6px; margin-bottom: 8px; }
        .btn-group:last-child { margin-bottom: 0; }

        button {
            flex: 1;
            border: none;
            padding: 10px 6px !important;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px !important;
            color: white;
            transition: all 0.2s ease;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.3);
        }

        button:hover { filter: brightness(1.15); transform: translateY(-1px); }
        button:active { transform: translateY(1px); box-shadow: none; }

        .bg-green { background-color: var(--btn-green); }
        .bg-orange { background-color: var(--btn-orange); }
        .bg-blue { background-color: var(--btn-blue); }
        .bg-purple { background-color: var(--btn-purple); }
        .bg-red { background-color: var(--btn-red); }
        .bg-gray { background-color: var(--btn-gray); }

        #controls { bottom: 20px; left: 20px; width: 200px; display: flex; flex-direction: column; }
        #controls button { padding: 8px 4px !important; font-size: 12px !important; }

        .frame-title { font-size: 14px; color: #bbb; font-weight: bold; text-align: center; letter-spacing: 1px; }
        .info-text { color: #888; font-size: 14px; text-align: center; margin-top: 5px; line-height: 1.4; font-style: italic; }

        .grid-frame {
            display: grid;
            grid-template-columns: auto 1fr auto; 
            grid-template-rows: auto 1fr auto;
            gap: 8px;
            align-items: center;
            justify-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 10px;
            border-radius: 8px;
            border: 1px dashed #555;
            margin: 6px 0 10px 0;
        }

        .corner { display: flex; align-items: center; justify-content: center; margin: auto; }
        .corner input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #9b59b6; margin: 0; }

        .side-input { display: flex; align-items: center; justify-content: center; }
        .side-input input {
            width: 28px; background: #222; border: 1px solid #555; color: #fff;
            text-align: center; border-radius: 4px; padding: 2px 0; font-family: monospace; font-size: 12px;
        }
        .side-input input:focus { border-color: #9b59b6; outline: none; }
        .grid-icon { font-size: 18px; color: #9b59b6; opacity: 0.3; }

        #setup-dashboard { top: 20px; left: 20px; width: 180px; text-align: center; }
        .setup-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; background: #222; border-radius: 6px; padding: 4px; }
        .setup-row button { flex: none; background: #444; padding: 4px 10px !important; }
        #member-display { font-size: 40px; font-weight: 900; color: #fff; }

        #role-info { border-top: 1px solid #333; padding-top: 12px; width: 100%; }
        .role-row { display: flex; align-items: flex-end; font-size: 40px; font-weight: 900; line-height: 1.2; margin-bottom: 8px; }
        .role-name, .role-num { flex-shrink: 0; }
        .role-dots { flex-grow: 1; border-bottom: 2px dotted #666; margin: 0 8px 6px 8px; opacity: 0.6; }
        .team-good { color: #3498db; }
        .team-evil { color: #e74c3c; }

        #timer-container { top: 20px; right: 20px; width: 220px; height: auto; padding-bottom: 20px; text-align: center; }
        .candle-holder { width: 80px; height: 200px; background: transparent; margin: 60px auto 16px auto; position: relative; border-bottom: 16px solid #333; }
        .candle-body {
            position: absolute; bottom: 0; left: 10px; width: 60px;
            background: linear-gradient(to right, #d4bb92, #e0c9a6, #d4bb92);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.4), 0 10px 20px rgba(0,0,0,0.5);
            transition: height 1s linear;
        }
        .flame {
            position: absolute; top: -40px; left: 50%; transform: translateX(-50%);
            width: 24px; height: 40px; background: #ff9d00; border-radius: 50% 50% 20% 20%;
            filter: blur(2px); box-shadow: 0 0 30px #ff4500, 0 0 60px rgba(255, 69, 0, 0.4);
            animation: flicker 0.15s infinite alternate;
        }
        @keyframes flicker { from { opacity: 0.8; transform: translateX(-50%) scale(0.9); } to { opacity: 1; transform: translateX(-50%) scale(1.1) rotate(2deg); } }
        .smoke { position: absolute; top: -40px; left: 50%; transform: translateX(-50%); width: 20px; height: 20px; background: rgba(150, 150, 150, 0.8); border-radius: 50%; filter: blur(8px); opacity: 0; pointer-events: none; }
        .smoke.puff { animation: smokeRise 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        @keyframes smokeRise { 0% { opacity: 0.8; transform: translateX(-50%) translateY(0) scale(1); } 50% { opacity: 0.4; transform: translateX(-65%) translateY(-50px) scale(3); } 100% { opacity: 0; transform: translateX(-35%) translateY(-100px) scale(5); } }

        #timer-display { font-size: 40px; font-weight: 900; color: #ff9d00 !important; margin-bottom: 12px; letter-spacing: 2px; text-shadow: 0 0 10px #ff4500, 0 0 20px rgba(255, 69, 0, 0.4); animation: textFlicker 0.15s infinite alternate; transition: color 0.5s, text-shadow 0.5s; }
        #timer-display.extinguished { color: #555 !important; text-shadow: 0 2px 4px rgba(0,0,0,0.8) !important; animation: none !important; }
        @keyframes textFlicker { from { opacity: 0.9; text-shadow: 0 0 8px #ff4500; } to { opacity: 1; text-shadow: 0 0 15px #ff4500, 0 0 30px rgba(255, 69, 0, 0.5); } }

        .timer-controls { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 12px; font-size: 13px; color: #aaa; }
        #timer-input { width: 45px; background: #222; border: 1px solid #555; color: white; text-align: center; border-radius: 4px; padding: 4px; }
        .timer-controls button { padding: 4px 10px !important; font-size: 14px !important; height: 28px; display: flex; align-items: center; justify-content: center; }
        #start-btn.running { background-color: var(--btn-red); }

        /* 토큰 기본 속성 */
        .token {
            position: absolute; width: 140px; height: 140px; border-radius: 50%;
            cursor: move; display: flex; align-items: center; justify-content: center;
            user-select: none; -webkit-user-select: none;
            border: 6px solid var(--alive-border); background-color: var(--alive-inner);
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            transition: border-color 0.2s, background-color 0.2s, opacity 0.2s;
            will-change: left, top; touch-action: none;
        }
        .token.dragging { transform: scale(1.05); z-index: 1000 !important; box-shadow: 0 15px 35px rgba(0,0,0,0.8); }
        .token input { width: 90%; background: transparent; border: none; color: white; text-align: center; font-size: 36px; font-weight: 900; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); transition: color 0.3s, text-shadow 0.3s; outline: none; margin: 0; padding: 0; user-select: text; height: auto; }
        .token[data-state="alive"] { border-color: var(--alive-border); background-color: var(--alive-inner); }
        .token[data-state="dead-vote"] { border-color: var(--dead-vote-border); background-color: var(--dead-bg); }
        .token[data-state="dead-no-vote"] { border-color: var(--dead-no-vote-border); background-color: var(--bg-color); opacity: 0.4; }
        .token[data-state="dead-vote"] input { color: #777; text-shadow: none; }
        .token[data-state="dead-no-vote"] input { color: #444; text-shadow: none; }

        /* =========================================
           플로팅 전용 완벽 독립 스타일 (간섭 원천 차단)
           ========================================= */
        .floating-item {
            position: absolute;
            z-index: 500;
            cursor: move;
            user-select: none;
            touch-action: none;
            /* width: auto !important 제거. JS의 inline-style 개입 허용 */
            height: auto !important;
            border-radius: 0 !important;
            background: transparent !important;
            border: none !important;
            display: inline-block !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin: 0 !important;
            box-sizing: border-box;
        }

        .floating-image {
            display: block;
            width: 100%; 
            height: auto;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 4px;
            object-fit: contain; 
            pointer-events: none; 
        }

        .floating-text {
            background: rgba(20, 20, 20, 0.85) !important;
            color: #eee;
            padding: 12px 18px !important;
            border-radius: 8px !important;
            border: 1px solid #444 !important;
            font-family: 'Nanum Myeongjo', serif;
            white-space: pre-wrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3) !important;
            /* [수정] 가로 제한을 없애고 콘텐츠 크기에 맞게 늘어나도록 설정 */
            max-width: none !important; 
            width: max-content !important; 
            min-width: 100px;
        }

        .floating-item:hover .floating-image, 
        .floating-item:hover.floating-text {
            border-color: var(--alive-border) !important;
        }

        .float-controls {
            position: absolute;
            top: 5px;   
            left: 5px;  
            display: none;
            gap: 4px;
            z-index: 510;
        }

        .floating-item:hover .float-controls { display: flex; }

        .float-controls button {
            width: 26px !important;  
            height: 26px !important;
            padding: 0 !important;
            font-size: 18px !important; 
            background: rgba(24, 24, 24, 0.8) !important;
            border: 1px solid #666 !important;
            border-radius: 4px !important;
            color: #fff !important;
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex: none; 
        }
        .float-controls button:hover { background: #444 !important; border-color: var(--alive-border) !important; }

        /* 우측 하단 사운드보드 패널 */
#soundboard {
    bottom: 20px;
    right: 20px;
    width: 340px; /* 5개 버튼이 들어갈 충분한 너비 */
    padding: 12px;
}

.sound-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr); /* 5열 균등 배치 */
    gap: 6px;
    margin-top: 10px;
}

.sound-btn {
    aspect-ratio: 1 / 1; /* 완벽한 정사각형 유지 */
    padding: 0 !important;
    border: 1px solid #444;
    border-radius: 6px;
    background-color: #222;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
}

/* 텍스트 가독성을 위한 하단 어두운 그라데이션 */
.sound-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 40%);
    z-index: 1;
    pointer-events: none;
}

.sound-btn span {
    position: relative;
    z-index: 2;
    font-size: 11px;
    color: #fff;
    padding-bottom: 4px;
    font-family: 'Nanum Myeongjo', serif;
    text-shadow: 1px 1px 2px #000;
    pointer-events: none;
}

.sound-btn:hover {
    border-color: var(--alive-border);
    transform: translateY(-2px);
}
.sound-btn:active {
    transform: translateY(0);
}
    </style>
</head>
<body>

<div id="controls" class="panel">
    <div class="btn-group">
        <button class="bg-green" onclick="createToken()">토큰 추가</button>
        <button class="bg-orange" onclick="shuffleNames()">자리 섞기</button>
    </div>
    <div class="btn-group">
        <button class="bg-blue" onclick="arrangeTokens('circle')">원형 정렬</button>
        <button class="bg-purple" onclick="customGrid()">사각형 정렬</button>
    </div>

    <div class="frame-title">사각형 정렬 설정<br>(꼭짓점은 체크박스)</div>
    <div class="grid-frame">
        <div class="corner"><input type="checkbox" id="chk-tl" checked></div>
        <div class="side-input col"><input type="number" id="inp-top" value="1" min="0"></div>
        <div class="corner"><input type="checkbox" id="chk-tr" checked></div>
        <div class="side-input row"><input type="number" id="inp-left" value="3" min="0"></div>
        <div class="frame-center"><div class="grid-icon">□</div></div>
        <div class="side-input row"><input type="number" id="inp-right" value="3" min="0"></div>
        <div class="corner"><input type="checkbox" id="chk-bl" checked></div>
        <div class="side-input col"><input type="number" id="inp-bottom" value="1" min="0"></div>
        <div class="corner"><input type="checkbox" id="chk-br" checked></div>
    </div>

    <div class="btn-group">
        <button class="bg-green" onclick="resetAllToAlive()">상태 초기화</button>
        <button class="bg-red" onclick="clearData()">토큰 초기화</button>
    </div>
    <div class="info-text">토큰 삭제는 우클릭입니다.</div>
</div>

<div id="setup-dashboard" class="panel">
    <div class="setup-row">
        <button onclick="changeMemberCount(-1)">◀</button>
        <span id="member-display">12인</span>
        <button onclick="changeMemberCount(1)">▶</button>
    </div>
    <div id="role-info"></div>
</div>

<div id="timer-container" class="panel">
    <div class="candle-holder">
        <div class="candle-body" id="candle-body" style="height: 100%;">
            <div class="flame" id="flame"></div>
            <div class="smoke" id="smoke"></div>
        </div>
    </div>
    <div id="timer-display">05:00</div>
    <div class="timer-controls">
        <input type="number" id="timer-input" value="5" min="1" max="99"> 분
        <button class="bg-gray" style="flex: none; padding: 4px 10px;" onclick="setTimer()">설정</button>
    </div>
    <div class="btn-group" style="margin-bottom: 0;">
        <button id="start-btn" class="bg-blue" onclick="toggleTimer()">시작</button>
        <button class="bg-gray" onclick="resetTimer()">초기화</button>
    </div>
</div>

<div id="container"></div>
    
<div id="soundboard" class="panel">
    <div class="frame-title">SOUNDBOARD</div>
    <div id="sound-grid" class="sound-grid">
        </div>
</div>
    
<script>
    const container = document.getElementById('container');
    const TOKEN_SIZE = 140;          
    const HALF_TOKEN = TOKEN_SIZE / 2;
    const SNAP_SIZE = 10;            
    const DEFAULT_PLAYER_COUNT = 12;  

    let activeToken = null;
    let offset = { x: 0, y: 0 };
    let isDragging = false;
    let startTime, startX, startY;

    window.addEventListener('load', () => {
        loadData();
        updateDashboard();
        initSoundboard(); // [추가] 사운드보드 버튼 생성
    });

    function loadData() {
        const existingItems = document.querySelectorAll('.token, .floating-item');
        existingItems.forEach(item => item.remove());

        const saved = localStorage.getItem('botc_data_v2');
        if (!saved) {
            for(let i = 0; i < currentCount; i++) createToken();
            setTimeout(() => arrangeTokens('circle'), 50);
            return;
        }

        const allData = JSON.parse(saved);
        if (allData.tokens) allData.tokens.forEach(d => createToken(d));
        if (allData.floating) {
            allData.floating.forEach(d => {
                if (d.type === 'float-image') {
                    createFloatingImage(d.content, d.x, d.y, parseFloat(d.scale) || 1);
                } else if (d.type === 'float-text') {
                    createFloatingText(d.content, d.x, d.y, parseFloat(d.fontSize) || 20);
                }
            });
        }
    }

    function saveData() {
        const tokens = Array.from(document.querySelectorAll('.token')).map(t => ({
            type: 'token',
            x: parseFloat(t.style.left) || 0,
            y: parseFloat(t.style.top) || 0,
            state: t.dataset.state,
            name: t.querySelector('input').value
        }));

        const floatingItems = Array.from(document.querySelectorAll('.floating-item')).map(item => {
            const isText = item.classList.contains('floating-text');
            return {
                type: isText ? 'float-text' : 'float-image',
                x: parseFloat(item.style.left) || 0,
                y: parseFloat(item.style.top) || 0,
                content: isText ? item.innerText : item.querySelector('img').src,
                scale: parseFloat(item.dataset.scale) || 1,
                fontSize: parseFloat(item.style.fontSize) || 20
            };
        });

        const allData = { tokens, floating: floatingItems };
        localStorage.setItem('botc_data_v2', JSON.stringify(allData));
    }

    function createToken(data = null) {
        const token = document.createElement('div');
        token.className = 'token';
        let x, y;
        if (data) {
            x = data.x; y = data.y;
            token.style.left = x + 'px'; token.style.top = y + 'px';
        } else {
            x = Math.random() * (window.innerWidth - TOKEN_SIZE);
            y = Math.random() * (window.innerHeight - TOKEN_SIZE);
            token.style.left = Math.round(x / SNAP_SIZE) * SNAP_SIZE + 'px';
            token.style.top = Math.round(y / SNAP_SIZE) * SNAP_SIZE + 'px';
        }
        
        token.dataset.state = data ? data.state : 'alive';
        const nameValue = data ? data.name : '';
        token.innerHTML = `<input type="text" placeholder="이름" value="${nameValue}" oninput="saveData()" onclick="event.stopPropagation()">`;

        token.oncontextmenu = (e) => {
            e.preventDefault();
            if(confirm("이 플레이어를 삭제하시겠습니까?")) {
                token.remove(); saveData();
            }
        };

        setupTokenEvents(token);
        container.appendChild(token);
        if(!data) saveData();
    }

    function clearData() {
        if(confirm("모든 데이터를 지우고 초기 상태(12명)로 돌아가시겠습니까?")) {
            localStorage.removeItem('botc_data_v2');
            localStorage.removeItem('botc_data');
            location.reload();
        }
    }

    function setupTokenEvents(token) {
        function startDrag(e) {
            if (document.activeElement instanceof HTMLElement) document.activeElement.blur();
            if (e.target.tagName === 'INPUT') return;
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            activeToken = token; isDragging = false; startTime = Date.now();
            startX = clientX; startY = clientY;
            offset.x = clientX - token.offsetLeft; offset.y = clientY - token.offsetTop;
            token.classList.add('dragging');
        }
        token.addEventListener('mousedown', startDrag);
        token.addEventListener('touchstart', startDrag, { passive: false });
    }

    function moveDrag(e) {
        if (!activeToken) return;
        const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
        const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
        if (Math.hypot(clientX - startX, clientY - startY) > 3) isDragging = true;
        if (isDragging) {
            if (e.type === 'touchmove') e.preventDefault(); 
            let rawX = clientX - offset.x; let rawY = clientY - offset.y;
            activeToken.style.left = Math.round(rawX / SNAP_SIZE) * SNAP_SIZE + 'px';
            activeToken.style.top = Math.round(rawY / SNAP_SIZE) * SNAP_SIZE + 'px';
        }
    }

    function endDrag(e) {
        if (!activeToken) return;
        const clientX = e.type.includes('mouse') ? e.clientX : (e.changedTouches ? e.changedTouches[0].clientX : startX);
        const clientY = e.type.includes('mouse') ? e.clientY : (e.changedTouches ? e.changedTouches[0].clientY : startY);
        const duration = Date.now() - startTime;
        const moveDistance = Math.hypot(clientX - startX, clientY - startY);

        if (!isDragging && duration < 200 && moveDistance < 5) {
            const clickedToken = e.target.closest('.token');
            if (clickedToken === activeToken && e.target.tagName !== 'INPUT') toggleState(activeToken);
        }
        if (isDragging) saveData();
        activeToken.classList.remove('dragging'); activeToken.style.zIndex = '';
        activeToken = null; isDragging = false;
    }

    window.addEventListener('mousemove', moveDrag);
    window.addEventListener('touchmove', moveDrag, { passive: false });
    window.addEventListener('mouseup', endDrag);
    window.addEventListener('touchend', endDrag);

    function toggleState(token) {
        const states = ['alive', 'dead-vote', 'dead-no-vote'];
        let currentIndex = states.indexOf(token.dataset.state);
        token.dataset.state = states[(currentIndex + 1) % states.length];
        saveData();
    }

    function resetAllToAlive() {
        if (!confirm("모든 플레이어를 '생존' 상태로 되돌리시겠습니까?")) return;
        document.querySelectorAll('.token').forEach(token => token.dataset.state = 'alive');
        saveData();
    }

    function shuffleNames() {
        const tokens = [...document.querySelectorAll('.token')];
        const names = tokens.map(t => String(t.querySelector('input').value));
        for (let i = names.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [names[i], names[j]] = [names[j], names[i]];
        }
        tokens.forEach((token, index) => { token.querySelector('input').value = names[index]; });
        requestAnimationFrame(() => saveData());
    }

    function arrangeTokens(type) {
        const tokens = document.querySelectorAll('.token');
        if (tokens.length === 0) return;
        const centerX = Math.floor(window.innerWidth / 2 - HALF_TOKEN);
        const centerY = Math.floor(window.innerHeight / 2 - HALF_TOKEN);
        const radius = Math.floor(Math.min(window.innerWidth, window.innerHeight) * 0.35);

        if (type === 'circle') {
            tokens.forEach((token, i) => {
                const angle = (2 * Math.PI * i) / tokens.length;
                token.style.left = Math.floor(centerX + radius * Math.cos(angle)) + 'px';
                token.style.top = Math.floor(centerY + radius * Math.sin(angle)) + 'px';
            });
        }
        saveData();
    }

    function customGrid() {
        const tokens = document.querySelectorAll('.token');
        const getSafeVal = (id) => Math.max(0, parseInt(document.getElementById(id).value) || 0);
        const t = getSafeVal('inp-top'); const b = getSafeVal('inp-bottom');
        const l = getSafeVal('inp-left'); const r = getSafeVal('inp-right');
        const hasTL = document.getElementById('chk-tl').checked; const hasTR = document.getElementById('chk-tr').checked;
        const hasBL = document.getElementById('chk-bl').checked; const hasBR = document.getElementById('chk-br').checked;

        document.getElementById('inp-top').value = t; document.getElementById('inp-bottom').value = b;
        document.getElementById('inp-left').value = l; document.getElementById('inp-right').value = r;

        const cornersCount = (hasTL ? 1 : 0) + (hasTR ? 1 : 0) + (hasBL ? 1 : 0) + (hasBR ? 1 : 0);
        const required = t + b + l + r + cornersCount; 
        
        if (tokens.length !== required) {
            alert(`현재 토큰은 ${tokens.length}개인데, 설정된 사각형 위치는 ${required}개입니다. 인원수를 맞춰주세요.`);
            return;
        }

        const sides = { top: t, bottom: b, left: l, right: r };
        const spacing = 160; 
        const width = (Math.max(sides.top, sides.bottom) + 1) * spacing;
        const height = (Math.max(sides.left, sides.right) + 1) * spacing;
        const centerX = Math.floor(window.innerWidth / 2 - HALF_TOKEN);
        const centerY = Math.floor(window.innerHeight / 2 - HALF_TOKEN);
        const startX = Math.floor(centerX - width / 2); const startY = Math.floor(centerY - height / 2);

        let coords = [];
        if (hasTL) coords.push({x: startX, y: startY});
        for(let i=1; i<=sides.top; i++) coords.push({x: startX + (width * i / (sides.top + 1)), y: startY});
        if (hasTR) coords.push({x: startX + width, y: startY});
        for(let i=1; i<=sides.right; i++) coords.push({x: startX + width, y: startY + (height * i / (sides.right + 1))});
        if (hasBR) coords.push({x: startX + width, y: startY + height});
        for(let i=1; i<=sides.bottom; i++) coords.push({x: startX + width - (width * i / (sides.bottom + 1)), y: startY + height});
        if (hasBL) coords.push({x: startX, y: startY + height});
        for(let i=1; i<=sides.left; i++) coords.push({x: startX, y: startY + height - (height * i / (sides.left + 1))});

        const uniqueCoords = []; const seen = new Set();
        coords.forEach(c => {
            const key = `${Math.floor(c.x)},${Math.floor(c.y)}`;
            if(!seen.has(key)) { uniqueCoords.push({x: Math.floor(c.x), y: Math.floor(c.y)}); seen.add(key); }
        });

        tokens.forEach((token, i) => {
            if(uniqueCoords[i]) { token.style.left = uniqueCoords[i].x + 'px'; token.style.top = uniqueCoords[i].y + 'px'; }
        });
        saveData();
    }

    let timerInterval = null; let timeLeft = 300; let totalTime = 300; 

    function updateTimerDisplay() {
        const min = Math.floor(timeLeft / 60); const sec = timeLeft % 60;
        const display = document.getElementById('timer-display');
        display.innerText = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        const safeTotal = totalTime > 0 ? totalTime : 1; 
        document.getElementById('candle-body').style.height = `${(timeLeft / safeTotal) * 100}%`;

        const flame = document.getElementById('flame'); const smoke = document.getElementById('smoke');
        if (timeLeft <= 0) {
            flame.style.display = 'none'; display.classList.add('extinguished');
            if (!smoke.classList.contains('puff')) smoke.classList.add('puff');
        } else {
            flame.style.display = 'block'; display.classList.remove('extinguished'); smoke.classList.remove('puff');
        }
    }

    function setTimer() {
        totalTime = document.getElementById('timer-input').value * 60; 
        timeLeft = totalTime; updateTimerDisplay(); stopTimer();
    }

    const bellBase64 = "";
    let audioCtx = null;

    function playMedievalBell() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        fetch(bellBase64).then(res => res.arrayBuffer()).then(buffer => audioCtx.decodeAudioData(buffer))
            .then(decodedData => {
                const source = audioCtx.createBufferSource(); source.buffer = decodedData;
                const gainNode = audioCtx.createGain(); gainNode.gain.value = 3; 
                source.connect(gainNode); gainNode.connect(audioCtx.destination);
                source.start(0);
            }).catch(e => console.error("오디오 재생 실패:", e));
    }

    function toggleTimer() {
        const btn = document.getElementById('start-btn');
        if (timerInterval) { stopTimer(); } else {
            btn.innerText = "일시정지"; btn.classList.add('running');
            timerInterval = setInterval(() => {
                if (timeLeft > 0) { timeLeft--; updateTimerDisplay(); } else { stopTimer(); playMedievalBell(); }
            }, 1000);
        }
    }

    function stopTimer() { clearInterval(timerInterval); timerInterval = null; const btn = document.getElementById('start-btn'); btn.innerText = "시작"; btn.classList.remove('running'); }
    function resetTimer() { stopTimer(); setTimer(); }

    const roleTable = {
        5: [3, 0, 1, 1], 6: [3, 1, 1, 1], 7: [5, 0, 1, 1], 8: [5, 1, 1, 1], 9: [5, 2, 1, 1], 10: [7, 0, 2, 1],
        11: [7, 1, 2, 1], 12: [7, 2, 2, 1], 13: [9, 0, 3, 1], 14: [9, 1, 3, 1], 15: [9, 2, 3, 1]
    };
    let currentCount = 12; 

    function changeMemberCount(val) {
        if (roleTable[currentCount + val]) { currentCount += val; updateDashboard(); }
    }

    function updateDashboard() {
        const d = roleTable[currentCount];
        document.getElementById('member-display').innerText = `${currentCount}인`;
        document.getElementById('role-info').innerHTML = `
            <div class="role-row team-good"><span class="role-name">주민</span><div class="role-dots"></div><span class="role-num">${d[0]}</span></div>
            <div class="role-row team-good"><span class="role-name">외지인</span><div class="role-dots"></div><span class="role-num">${d[1]}</span></div>
            <div class="role-row team-evil"><span class="role-name">하수인</span><div class="role-dots"></div><span class="role-num">${d[2]}</span></div>
            <div class="role-row team-evil"><span class="role-name">악마</span><div class="role-dots"></div><span class="role-num">${d[3]}</span></div>
        `;
    }

    /* =========================================
       [플로팅 생성 및 독립 관리 로직 (완벽 격리)]
       ========================================= */
    window.addEventListener('paste', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        const items = e.clipboardData.items;
        for (let i = 0; i < items.length; i++) {
            if (items[i].type.indexOf('image') !== -1) {
                const blob = items[i].getAsFile(); const reader = new FileReader();
                reader.onload = (ev) => createFloatingImage(ev.target.result); reader.readAsDataURL(blob);
            } else if (items[i].type.indexOf('plain') !== -1) {
                items[i].getAsString((text) => { if (text.trim()) createFloatingText(text); });
            }
        }
    });

    function createFloatingImage(src, savedX = '200px', savedY = '200px', savedScale = 1) {
        const img = new Image();
        img.src = src;
        
        img.onload = function() {
            const div = document.createElement('div');
            div.className = 'floating-item'; 
            div.style.left = typeof savedX === 'number' ? savedX + 'px' : savedX;
            div.style.top = typeof savedY === 'number' ? savedY + 'px' : savedY;
            
            const scale = parseFloat(savedScale) || 1;
            div.dataset.scale = scale;

            const content = document.createElement('img');
            content.src = src;
            content.className = 'floating-image';
            
            div.appendChild(content);
            addFloatingEvents(div);
            addFloatControls(div); 
            container.appendChild(div);

            const origW = img.naturalWidth || img.width || 300; 
            div.dataset.origWidth = origW;
            div.style.width = (origW * scale) + 'px';
            
            saveData();
        };
    }

    function createFloatingText(text, savedX = '250px', savedY = '250px', savedSize = 20) {
        const div = document.createElement('div');
        div.className = 'floating-item floating-text';
        div.style.left = typeof savedX === 'number' ? savedX + 'px' : savedX;
        div.style.top = typeof savedY === 'number' ? savedY + 'px' : savedY;
        div.style.fontSize = savedSize + 'px';
        div.innerText = text;

        addFloatingEvents(div); addFloatControls(div); 
        container.appendChild(div);
        saveData();
    }

    function addFloatingEvents(el) {
        el.onmousedown = function(e) {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
            let shiftX = e.clientX - el.getBoundingClientRect().left;
            let shiftY = e.clientY - el.getBoundingClientRect().top;

            function onMouseMove(moveEvent) {
                el.style.left = moveEvent.clientX - shiftX + 'px';
                el.style.top = moveEvent.clientY - shiftY + 'px';
            }

            document.addEventListener('mousemove', onMouseMove);
            document.onmouseup = function() {
                document.removeEventListener('mousemove', onMouseMove);
                document.onmouseup = null;
                saveData(); 
            };
        };

        el.oncontextmenu = (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            e.preventDefault();
            if (confirm("이 플로팅 아이템을 삭제하시겠습니까?")) { el.remove(); saveData(); }
        };
        el.ondragstart = () => false;
    }

    function addFloatControls(el) {
        const controls = document.createElement('div');
        controls.className = 'float-controls';

        const btnMinus = document.createElement('button');
        btnMinus.innerText = '-';
        btnMinus.onclick = (e) => { e.stopPropagation(); changeScale(el, false); };

        const btnPlus = document.createElement('button');
        btnPlus.innerText = '+';
        btnPlus.onclick = (e) => { e.stopPropagation(); changeScale(el, true); };

        controls.appendChild(btnMinus); controls.appendChild(btnPlus);
        el.appendChild(controls);
        controls.onmousedown = (e) => e.stopPropagation();
    }

    function changeScale(el, isEnlarging) {
        const step = 0.2;
        const delta = isEnlarging ? step : -step;
        
        let currentScale = parseFloat(el.dataset.scale);
        if (isNaN(currentScale)) currentScale = 1;
        
        let newScale = Math.max(0.2, Math.min(4, currentScale + delta));
        newScale = parseFloat(newScale.toFixed(1)); 
        
        el.dataset.scale = newScale;

        if (el.classList.contains('floating-text')) {
            const currentSize = parseFloat(el.style.fontSize) || 20;
            el.style.fontSize = Math.max(10, currentSize + (delta * 20)) + 'px';
        } else {
            // CSS width: auto !important가 제거되었으므로 즉각 반응합니다.
            const origW = parseFloat(el.dataset.origWidth);
            if (!isNaN(origW) && origW > 0) {
                el.style.width = (origW * newScale) + 'px';
            }
        }
        saveData();
    }

/* =========================================
   [사운드보드 데이터 및 자동 매칭 로직]
   ========================================= */

// 1. 여기에 원하시는 버튼 이름(파일명)을 순서대로 최대 25개까지 적으십시오.
// 확장자를 제외한 순수 파일명만 적으시면 됩니다.
const soundNames = [
    "처형", "2", "3", "4", "5",
    "6", "7", "8", "9", "10",
    "총잡이", "12", "13", "14", "15",
    "바이올린\n연주자", "17", "18", "19", "20",
    "21", "22", "23", "24", "25"
];

// GitHub Base URL 설정 (스젯님의 리포지토리 raw 주소)
const GITHUB_RAW_BASE = "https://raw.githubusercontent.com/Katrina-Sjet/BotC_Token/main";

// 이름을 기반으로 25개의 정사각형 객체를 자동 생성하는 배열 변환
const soundData = Array.from({ length: 25 }, (_, i) => {
    // 정의된 이름이 있으면 쓰고, 없으면 빈 칸으로 둡니다.
    const name = soundNames[i] || ""; 
    
    return {
        id: `snd_${i + 1}`,
        name: name,
        // 이름이 존재할 때만 규칙에 맞게 GitHub Raw 주소를 자동 생성합니다.
        img: name ? `${GITHUB_RAW_BASE}/images/${encodeURIComponent(name)}.png` : "",
        url: name ? `${GITHUB_RAW_BASE}/sounds/${encodeURIComponent(name)}.flac` : ""
    };
});

function initSoundboard() {
    const grid = document.getElementById('sound-grid');
    grid.innerHTML = ''; // 기존 그리드 비우기

    soundData.forEach(data => {
        const btn = document.createElement('button');
        btn.className = 'sound-btn';
        
        // 데이터가 비어있는 버튼은 비활성 스타일 처리
        if (!data.name) {
            btn.style.backgroundColor = '#1a1a1a';
            btn.style.cursor = 'default';
            btn.style.pointerEvents = 'none';
            grid.appendChild(btn);
            return;
        }

        // 자동으로 매칭된 GitHub 이미지를 배경으로 삽입
        btn.style.backgroundImage = `url('${data.img}')`;
        
        btn.onclick = (e) => {
            e.stopPropagation();
            playSpecificSound(data.url);
        };
        
        const label = document.createElement('span');
        label.innerText = data.name;
        btn.appendChild(label);
        
        grid.appendChild(btn);
    });
}

function playSpecificSound(url) {
    if (!url) return;
    const audio = new Audio(url);
    audio.volume = 1;
    audio.play().catch(e => console.error("오디오 로드 또는 재생 실패 (GitHub 경로 확인 필요):", e));
}
    
</script>
